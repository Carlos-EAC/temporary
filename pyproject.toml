[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-sim"
version = "0.1.0"
description = "Simulación 2D multiagente de cosecha (línea base reactiva) — Equipo 3, TC2008B"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
